apiVersion: v1
kind: ConfigMap
metadata:
  name: poll-config
  namespace: poll-app
data:
  REDIS_HOST: "redis"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "poll"
  POSTGRES_USER: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: poll-app
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS votes
    (
      id text PRIMARY KEY,
      vote text NOT NULL
    );